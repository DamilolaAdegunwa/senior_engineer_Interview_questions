name: Verify Textbook Integrity

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Verification Test Suite
        run: |
          python3 scripts/verify_book.py

      - name: Test CLI Search Tool
        run: |
          python3 interactive_explorer/search_cli.py --query "Raft" --limit 5
          python3 interactive_explorer/search_cli.py --id 126
